name: Build portfolio app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Verify gateway protections
        run: npm run test:gateway

      - name: Verify performance data and migrations
        run: npm run test:performance

      - name: Build app
        run: npm run build
