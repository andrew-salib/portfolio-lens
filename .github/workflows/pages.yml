name: Deploy front end to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require current live laptop backend
        run: node scripts/check-backend-deployment.mjs
        env:
          API_URL: ${{ vars.API_URL }}
      - run: npm run install:ci
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Recheck backend before publishing
        run: node scripts/check-backend-deployment.mjs
        env:
          API_URL: ${{ vars.API_URL }}
      - uses: actions/deploy-pages@v4
        id: deployment
